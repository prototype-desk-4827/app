*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:16px}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--head);border-bottom:2px solid var(--gold);padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:14px;margin:0;color:var(--gold);line-height:1.4;flex:1}
header button.back{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:6px 12px;font-size:15px}
main{max-width:760px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--tb);border-radius:16px;background:var(--tile);color:var(--tc);padding:22px 10px;text-align:center;font-size:21px;font-weight:900;-webkit-text-stroke:.6px currentColor;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;font-family:inherit}
.tile .ic{font-size:34px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--icBg);color:var(--icC)}
.tile.green{background:var(--green);color:#fff;border-color:#4fd483}
.tile.wide{grid-column:1/-1;min-height:90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{color:var(--gold);font-size:18px;margin:4px 0 12px}
h3{color:var(--gold2);font-size:16px;margin:14px 0 6px}
label{display:block;color:var(--mut);font-size:14px;margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--inp);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,[contenteditable]:focus{outline:2px solid var(--gold)}
.btn{background:var(--gold);color:var(--onGold);border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;font-family:inherit}
.btn.sec{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.red{background:#7a1f1f;color:#fff}
.btn.g{background:var(--green);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:inherit;font-size:15px;font-weight:700}
.tabs button.on{background:var(--gold);color:var(--onGold)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer}
.item:last-child{border:0}
.item small{color:var(--mut);display:block}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--gold);color:var(--gold)}
.badge.ok{background:var(--green);border-color:var(--green);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border:1px solid var(--line);padding:8px;text-align:center}
th{background:var(--noteBg);color:var(--gold)}
tfoot td{font-weight:700;color:var(--gold)}
.note{background:var(--noteBg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--mut);font-size:13px;line-height:1.7;margin:10px 0}
.editor{min-height:240px;background:#fff;color:#000;border-radius:10px;padding:14px;font-size:18px;line-height:2;direction:rtl}
.tb{display:flex;gap:6px;margin:8px 0}
.tb button{background:var(--inp);color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:15px;font-family:inherit}
canvas.sig{width:100%;height:140px;background:#fff;border-radius:10px;touch-action:none;display:block}
.demo{background:#7a1010;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 8px;line-height:1.5}
#printArea{display:none}
@media print{
 body>*:not(#printArea){display:none!important}
 #printArea{display:block;color:#000;background:#fff;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
 @page{size:A4;margin:12mm 15mm 15mm 15mm}
 html,body{background:#fff}
}
.pt{width:100%;border-collapse:collapse;direction:rtl}.pt td{padding:0;border:0}.pt thead{display:table-header-group}.pt tr{page-break-inside:auto}
.lh{display:flex;flex-direction:row;direction:rtl;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:3mm;margin-bottom:6mm}
.lh .emb{width:28mm;height:28mm;flex:none}
.lh .emb img{width:100%;height:100%;object-fit:contain;display:block}
.lh .lt{flex:1}
.lh .t1{font-size:20px;font-weight:700}
.lh .t2{display:flex;align-items:flex-end;gap:8px;font-size:18px;margin-top:8px}
.lh .t2 span.blank{display:inline-block;width:200px;border-bottom:1px solid #000;height:22px}
.pmeta{display:flex;justify-content:space-between;font-size:16px;margin-bottom:10px}
.ptitle{text-align:center;font-weight:700;font-size:22px;margin:16px 0;text-decoration:underline}
.pbody{font-size:18px;line-height:2;white-space:pre-wrap}
.pmeta{display:flex;justify-content:space-between;font-size:16px;margin-bottom:10px}
.ptitle{text-align:center;font-weight:700;font-size:22px;margin:16px 0;text-decoration:underline}
.psig br{display:none}.psig{margin-top:20px;text-align:left;font-size:16px}
.psig img{max-height:80px;display:block;margin-top:6px}
</style>

let S;

function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S){S={cases:[],memos:[],defs:[],notes:[],settings:{secretary:'',court:''},demo:false};}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOk=false;alert('تعذر الحفظ على الجهاز (المساحة ممتلئة أو التخزين معطل). استخدم «نسخة احتياطية» من الإعدادات.')}}
/* IndexedDB for files */
let dbp;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{setTimeout(()=>rej(new Error('idb timeout')),2500);try{const r=indexedDB.open('np-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function fput(id,blob){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(id){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fdel(id){const d=await db();return new Promise(res=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=res})}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

/* DOCX (real OOXML in a minimal zip) */
function crc32(b){let c,t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}
 let r=-1;for(let i=0;i<b.length;i++)r=t[(r^b[i])&255]^(r>>>8);return(r^-1)>>>0}
function zip(files){const enc=new TextEncoder();const parts=[],cd=[];let off=0;
 const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>24&255];
 for(const[name,data]of files){const nb=enc.encode(name),crc=crc32(data);
  const h=[0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)];
  parts.push(new Uint8Array(h),nb,data);
  cd.push({nb,crc,len:data.length,off});off+=h.length+nb.length+data.length}
 const cds=off;let cl=0;
 for(const e of cd){const h=new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(e.crc),...u32(e.len),...u32(e.len),...u16(e.nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(e.off)]);parts.push(h,e.nb);cl+=h.length+e.nb.length}
 parts.push(new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(cd.length),...u16(cd.length),...u32(cl),...u32(cds),0,0]));
 return new Blob(parts,{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
async function makeDocx(m){

 const para=(runs,o={})=>`<w:p><w:pPr><w:bidi/>${o.li?'<w:ind w:end="360"/>':''}<w:jc w:val="${o.c?'center':'left'}"/></w:pPr>${runs}</w:p>`;
 const P=(t,o={})=>para(t?run(t,o):'',o);
 /* html -> paragraphs with bold/underline runs */
 const root=document.createElement('div');root.innerHTML=m.html;
 const paras=[];let cur=[];
 const flush=(li)=>{if(cur.length||li)paras.push(para(cur.join(''),{li}));cur=[]};
 (function walk(n,f,li){
  n.childNodes.forEach(c=>{
   if(c.nodeType===3){const t=c.textContent.replace(/\s+/g,' ');if(t.trim()||cur.length)cur.push(run(t,f))}
   else if(c.nodeType===1){const tg=c.tagName;
    if(tg==='BR'){flush()}
    else if(tg==='B'||tg==='STRONG')walk(c,{...f,b:1},li);
    else if(tg==='U')walk(c,{...f,u:1},li);
    else if(tg==='LI'){flush();cur.push(run('• ',f));walk(c,f,1);flush(1)}
    else if(tg==='DIV'||tg==='P'||tg==='UL'||tg==='OL'){flush();walk(c,f,li);flush()}
    else walk(c,f,li)}})})(root,{},0);
 flush();
 const body=P(m.caseNum?'قضية رقم '+m.caseNum:'')+P('التاريخ: '+(m.date||''))+P(m.title,{b:1,c:1,s:34})+paras.join('')+P('')+P('وكيل النيابة');
 let sigXml='',rels='',ctExtra='',media=[];
 const lg=await getLogo();const lgb=atob(lg.split(',')[1]);const lgu=new Uint8Array(lgb.length);for(let i=0;i<lgb.length;i++)lgu[i]=lgb.charCodeAt(i);media.push(['word/media/logo.jpg',lgu]);
 if(m.sig){const bin=atob(m.sig.split(',')[1]);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);media.push(['word/media/sig.png',b]);
  const cx=2000000,cy=800000;
  sigXml=`<w:p><w:pPr><w:jc w:val="left"/></w:pPr><w:r><w:drawing><wp:inline xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="1" name="signature"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="1" name="sig.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
  rels='<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/sig.png"/>';
  ctExtra+='<Default Extension="png" ContentType="image/png"/>';}
 else sigXml=P('التوقيع: ........................');
 ctExtra+='<Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/>';
 rels+='<Relationship Id="rIdH" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/>';
 const hc=1080000;const hdr=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:bidiVisual/><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="6800"/><w:gridCol w:w="2900"/></w:tblGrid><w:tr><w:tc><w:tcPr><w:tcW w:w="6800" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${P('النيابة الإدارية',{b:1,s:32})}${P('نيابة: ........................................')}</w:tc><w:tc><w:tcPr><w:tcW w:w="2900" w:type="dxa"/></w:tcPr><w:p><w:pPr><w:jc w:val="left"/></w:pPr><w:r><w:drawing><wp:inline xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${hc}" cy="${hc}"/><wp:docPr id="2" name="logo"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="2" name="logo.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdL"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${hc}" cy="${hc}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p></w:tc></w:tr></w:tbl><w:p/></w:hdr>`;
 media.push(['word/_rels/header1.xml.rels',enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdL" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.jpg"/></Relationships>')]);media.push(['word/header1.xml',enc.encode(hdr)]);
 const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}${sigXml}<w:sectPr><w:headerReference w:type="default" r:id="rIdH"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2600" w:right="1134" w:bottom="1134" w:left="1134" w:header="500" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
 return zip([['[Content_Types].xml',enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'+ctExtra+'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')],
 ['_rels/.rels',enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')],
 ['word/_rels/document.xml.rels',enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>')],
 ['word/document.xml',enc.encode(doc)],...media]);
}
/* DEFERRALS */
views.defs=()=>{
 app.innerHTML=`<h2>إرجاءات البت</h2>
 <div class="card">${S.defs.length?S.defs.map(d=>`<div class="item" data-id="${d.id}"><div><b>رقم ${esc(d.num)} لسنة ${esc(d.year)}</b><small>أصلها القضية رقم ${esc(d.origNum)} لسنة ${esc(d.origYear)} - آخر تصرف: ${esc(d.last||'—')}</small></div></div>`).join(''):'<div style="color:var(--mut);text-align:center">لا توجد إرجاءات</div>'}</div>
 <button class="btn" id="add">+ إضافة إرجاء</button>`;
 $('#add').onclick=()=>go('def',{id:null});
 app.querySelectorAll('.item').forEach(i=>i.onclick=()=>go('def',{id:i.dataset.id}));
};
views.def=n=>{
 let d=n.id?S.defs.find(x=>x.id===n.id):null;const isNew=!d;
 if(isNew)d={id:uid(),num:'',year:CUR,origNum:'',origYear:'',last:''};
 app.innerHTML=`<h2>${isNew?'إرجاء جديد':'إرجاء رقم '+esc(d.num)}</h2><div class="card">
 <label>رقم</label><input id="num" inputmode="numeric" value="${esc(d.num)}">
 <label>لسنة</label><input id="year" inputmode="numeric" value="${esc(d.year)}">
 <label>أصلها القضية رقم</label><input id="origNum" inputmode="numeric" value="${esc(d.origNum)}">
 <label>لسنة</label><input id="origYear" inputmode="numeric" value="${esc(d.origYear)}">
 <label>آخر تصرف</label><textarea id="last" style="min-height:80px">${esc(d.last)}</textarea></div>
 <div class="row"><button class="btn" id="save">حفظ</button>${isNew?'':'<button class="btn g" id="memo">تحرير مذكرة</button><button class="btn red" id="del">حذف</button>'}</div>`;
 const commit=()=>{['num','year','origNum','origYear','last'].forEach(k=>d[k]=$('#'+k).value.trim());if(!d.num){alert('اكتب الرقم');return false}if(!S.defs.includes(d))S.defs.push(d);save();return true};
 $('#save').onclick=()=>{if(commit()){nav.pop();render()}};
 if($('#memo'))$('#memo').onclick=()=>{if(commit())go('memo',{id:null,def:d})};
 if($('#del'))$('#del').onclick=()=>{if(confirm('حذف؟')){S.defs=S.defs.filter(x=>x!==d);save();nav.pop();render()}};
};
/* STATS */
views.stats=n=>{
 const y=n.y||CUR;
 const ref=Array(12).fill(0),fin=Array(12).fill(0);
 S.cases.forEach(c=>{if(c.referDate&&c.referDate.startsWith(y+'-'))ref[+c.referDate.slice(5,7)-1]++;
  if(c.result&&c.resultDate&&c.resultDate.startsWith(y+'-'))fin[+c.resultDate.slice(5,7)-1]++});
 let rem=0;
 const rows=MONTHS.map((mn,i)=>{rem+=ref[i]-fin[i];return`<tr><td>${mn}</td><td>${ref[i]}</td><td>${fin[i]}</td><td>${rem}</td></tr>`}).join('');
 const tr=ref.reduce((a,b)=>a+b,0),tf=fin.reduce((a,b)=>a+b,0);
 app.innerHTML=`<h2>الإحصائية</h2><label>السنة</label><input id="y" inputmode="numeric" value="${y}">
 <div class="card" style="overflow:auto;margin-top:12px"><table><thead><tr><th>الشهر</th><th>القضايا المحالة</th><th>القضايا المنتهية</th><th>الرصيد المتبقي</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>الإجمالي</td><td>${tr}</td><td>${tf}</td><td>${tr-tf}</td></tr></tfoot></table></div>
 <div class="note">الجدول يُحسب تلقائيا من القضايا: المحالة حسب «تاريخ الإحالة»، والمنتهية هي القضايا التي كُتبت لها «نتيجة التصرف» حسب «تاريخ انتهاء التصرف». الرصيد تراكمي داخل السنة المعروضة فقط ولا يشمل المرحّل من سنوات سابقة.</div>`;
 $('#y').onchange=e=>{n.y=+e.target.value||CUR;render()};
};
/* NOTES */
views.notes=()=>{
 app.innerHTML=`<h2>ملاحظات</h2><div class="card"><textarea id="t" placeholder="اكتب ملاحظة..."></textarea><div class="row"><button class="btn" id="add">إضافة</button></div></div>
 ${S.notes.slice().reverse().map(x=>`<div class="card"><small style="color:var(--mut)">${esc(x.at)}</small><div style="white-space:pre-wrap;margin:6px 0">${esc(x.t)}</div><button class="btn red" data-d="${x.id}">حذف</button></div>`).join('')}`;
 $('#add').onclick=()=>{const t=$('#t').value.trim();if(!t)return;S.notes.push({id:uid(),t,at:new Date().toLocaleString('ar-EG')});save();render()};
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.notes=S.notes.filter(x=>x.id!==b.dataset.d);save();render()});
};
/* SETTINGS */
views.settings=()=>{
 app.innerHTML=`<h2>الإعدادات</h2><div class="card">
 <label>شكل التطبيق</label><select id="theme"><option value="logo">ألوان الشعار: أخضر وذهبي وأحمر</option><option value="dark">أسود وذهبي</option><option value="ivory">عاجي وذهبي فاتح</option><option value="sand">رملي وطوبي</option><option value="teal">أبيض وتركواز</option><option value="lav">لافندر</option><option value="mint">نعناعي بحواف سوداء</option><option value="navy">عاجي وكحلي</option><option value="emerald">أبيض وأخضر زمردي</option><option value="burgundy">رمادي فاتح وعنابي</option><option value="sky">أبيض وأزرق سماوي</option></select>
 <label>اسم النيابة (يُكتب بجوار كلمة «نيابة» في ورق المذكرة، اتركه فارغا لتكتبه بخط اليد)</label><input id="court" value="${esc(S.settings.court)}">
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="dictOk" style="width:auto" ${S.settings.dictOk?'checked':''}> الموافقة على الإملاء الصوتي عبر المتصفح</label>
 <label>إيميل السكرتير (لتجهيز مسودة فقط، لا إرسال تلقائي)</label><input id="sec" type="email" inputmode="email" value="${esc(S.settings.secretary)}">
 <label>شعار النيابة الإدارية الرسمي (ارفع الصورة المعتمدة. حاليا يظهر مربع بديل)</label><input type="file" id="logo" accept="image/*">
 <div class="row"><button class="btn" id="save">حفظ</button></div></div>
 <div class="card"><h3 style="margin-top:0">نسخة احتياطية</h3>
 <div class="note">البيانات محفوظة على هذا الجهاز وهذا المتصفح فقط. مسح بيانات المتصفح يحذفها. صدّر نسخة احتياطية (بدون المرفقات والشعار) بانتظام.</div>
 <div class="row"><button class="btn sec" id="exp">تصدير النسخة الاحتياطية</button><label class="btn sec" style="margin:0">استيراد<input type="file" id="imp" hidden accept=".json"></label></div></div>
 <div class="card"><h3 style="margin-top:0">بيانات تجريبية</h3><div class="row"><button class="btn sec" id="demo">${S.demo?'حذف البيانات الوهمية':'تحميل بيانات وهمية للتجربة'}</button></div></div>`;
 $('#theme').value=S.settings.theme||'logo';$('#theme').onchange=()=>{S.settings.theme=$('#theme').value;save();render()};
 $('#save').onclick=async()=>{S.settings.court=$('#court').value.trim();S.settings.secretary=$('#sec').value.trim();S.settings.dictOk=$('#dictOk').checked;S.settings.theme=$('#theme').value;const f=$('#logo').files[0];if(f)await fput('logo',f);save();alert('تم الحفظ')};
 $('#exp').onclick=()=>dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'np-backup-'+new Date().toISOString().slice(0,10)+'.json');
 $('#imp').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!o.cases||!o.memos)throw 0;if(!confirm('سيستبدل هذا كل البيانات الحالية. متابعة؟'))return;S=o;save();render()}catch(x){alert('ملف غير صالح')}};
 $('#demo').onclick=()=>{
  if(S.demo){S.cases=S.cases.filter(c=>!c.demo);S.memos=S.memos.filter(c=>!c.demo);S.defs=S.defs.filter(c=>!c.demo);S.demo=false}
  else{const y=CUR,pm=y-1;
   [['101',y,'مخالفة مالية - بيانات وهمية','01-12','01-15','حفظ'],['102',y,'تأخر في الصرف - بيانات وهمية','02-03','02-10',''],['103',y,'إهمال في العمل - بيانات وهمية','02-20','03-01','مجازاة'],['55',pm,'قضية سابقة - بيانات وهمية','11-05','11-09','حفظ']]
   .forEach(([num,yy,s,r,rd,res])=>S.cases.push({id:uid(),demo:1,year:yy,num,subject:s,report:'',complaint:'',referDate:yy+'-'+r,readDate:yy+'-'+rd,result:res,resultDate:res?yy+'-'+rd:'',memoId:'',files:[]}));
   S.defs.push({id:uid(),demo:1,num:'7',year:y,origNum:'101',origYear:y,last:'طلب أوراق إضافية (وهمي)'});S.demo=true}
  save();render()};
};
load();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
